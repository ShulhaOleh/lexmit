name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - run: bun install --frozen-lockfile
            - run: bun check
            - run: bun fmt --check
            - run: bun run test
            - run: bun run build

    # The published package runs on Node. These jobs run the tests and the built command there.
    node:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                # The tests run their TypeScript directly, which Node does without a flag from 22.18.
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}

            - run: bun install --frozen-lockfile
            - run: bun run test:node
            - run: bun run build
            - run: node dist/cli.mjs help
